name: Hades Bot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run smoke tests
        env:
          PYTHONPATH: .
          DISCORD_TOKEN: ci-test-token
          GEMINI_API_KEY: ci-test-key
        run: |
          python tests/smoke/current_build_smoke.py
          python tests/smoke/fan_teasing_smoke.py
          python tests/smoke/improvement_smoke.py
          python tests/smoke/knowledge_smoke.py
          python tests/smoke/scope_smoke.py
          python tests/smoke/static_smoke.py
          python tests/smoke/structure_smoke.py
          python tests/smoke/render_startup_smoke.py
