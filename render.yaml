services:
  - type: web
    name: hades-discord-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health

    envVars:
      - key: DISCORD_TOKEN
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

      - key: BOT_PREFIX
        value: "h!"

      - key: MAX_HISTORY
        value: "24"

      - key: MAX_OUTPUT_TOKENS
        value: "1024"

      - key: USER_COOLDOWN
        value: "2.0"
